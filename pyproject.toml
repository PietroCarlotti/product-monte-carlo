[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pmc"
version = "0.1.0rc2"
requires-python = ">=3.10"
dependencies = [
    "gpytorch>=1.11,<2",
    "linear-operator>=0.5,<1",
    "matplotlib",
    "numpy>=1.24,<3",
    "pandas",
    "plotly",
    "POT",
    "psutil",
    "pyro-ppl>=1.9,<2",
    "scipy>=1.10,<2",
    "statsmodels",
    "torch>=2.1,<3",
    "tqdm",
    "zuko",
]

[project.optional-dependencies]
test = [
    "build",
    "pytest",
    "ruff",
    "scikit-learn",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pmc", "pmc.data", "pmc.experiments", "pmc.experiments.gaussian_mixture"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
